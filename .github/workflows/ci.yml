name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci

      - name: Security scan (npm audit)
        run: npm audit --audit-level=moderate

      - name: Lint (ESLint)
        run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0

      - name: Run unit tests
        env:
          CI: true
        run: npm test -- --watchAll=false --silent

      - name: Run build
        run: npm run build --if-present

      - name: UI tests (Playwright)
        run: |
          npx playwright install --with-deps
          npx playwright test

      - name: List Mantine packages
        run: |
          echo "Mantine deps in package.json:" && node -e "const p=require('./package.json'); Object.keys(p.dependencies||{}).filter(k=>k.startsWith('@mantine/')).forEach(k=>console.log(k+': '+p.dependencies[k]))"
